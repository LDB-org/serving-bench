[package]
name = "serving-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/LDB-org/serving-bench"
description = "Performance and behavior evaluation for deployed language models"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eventsource-stream = "0.2"
futures-util = "0.3"
jsonschema = { version = "0.29", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

